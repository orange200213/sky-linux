# sky: password login as root is the normal way into this box (USB link and,
# later, Wi-Fi). upstream's default is PermitRootLogin prohibit-password, and
# the packaged /etc/ssh/sshd_config does not override it.
#
# Read through "Include /etc/ssh/sshd_config.d/*.conf" at the top of the
# packaged config, so these win: the first value seen for a keyword is used.
PermitRootLogin yes
PasswordAuthentication yes
PermitEmptyPasswords no
